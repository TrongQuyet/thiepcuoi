<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tạo link thiệp mời</title>
<style>
  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --text: #3d352c;
    --muted: #8a7f70;
    --accent: #928362;
    --accent-dark: #7a6c4f;
    --border: #e4ddd1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent-dark); }
  p.hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  textarea {
    width: 100%; min-height: 160px; padding: 12px;
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; color: inherit; background: var(--card); resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .options { display: grid; gap: 12px; margin-bottom: 14px; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend, .field-label { font-size: 14px; color: var(--muted); margin-bottom: 6px; padding: 0; }
  .segmented { display: inline-flex; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .segmented label { position: relative; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented span { display: block; padding: 8px 18px; font-size: 15px; color: var(--accent-dark); cursor: pointer; }
  .segmented input:checked + span { background: var(--accent); color: #fff; font-weight: 600; }
  .segmented input:focus-visible + span { outline: 2px solid var(--accent-dark); outline-offset: -3px; }
  .time-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type=time], select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
    font: inherit; color: var(--text); background: var(--card);
  }
  select { width: 100%; }
  input[type=time]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .time-hint { font-size: 13px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
  button {
    border: 0; border-radius: 999px; padding: 10px 18px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary { background: transparent; color: var(--accent-dark); border: 1px solid var(--accent); }
  button.small { padding: 6px 12px; font-size: 14px; }
  button:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.guest {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  }
  .name { font-weight: 600; }
  .link { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .row-actions { display: flex; gap: 6px; }
  .count { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 8px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Tạo link thiệp mời</h1>
  <p class="hint">Mỗi dòng một khách mời, ví dụ: <em>Anh Nam &amp; Chị Lan</em>, <em>Gia đình Bác Hùng</em>. Tên sẽ hiện ở dòng "Trân trọng kính mời" và tự điền vào form xác nhận.</p>

  <div class="options">
    <div>
      <label class="field-label" for="target">Link mở vào</label>
      <select id="target"></select>
    </div>
    <fieldset>
      <legend>Thiệp của</legend>
      <div class="segmented">
        <label><input type="radio" name="side" value="trai" checked><span>Nhà trai</span></label>
        <label><input type="radio" name="side" value="gai"><span>Nhà gái</span></label>
      </div>
    </fieldset>
    <div>
      <label class="field-label" for="time">Giờ mời dự tiệc</label>
      <div class="time-row">
        <input type="time" id="time">
        <button type="button" class="small secondary" id="clearTime" hidden>Dùng giờ trên thiệp</button>
        <span class="time-hint" id="timeHint"></span>
      </div>
    </div>
  </div>

  <textarea id="names" placeholder="Điền tên người bạn muốn mời"></textarea>

  <div class="actions">
    <button id="make">Tạo link</button>
  </div>

  <div id="count" class="count"></div>
  <ul id="list"></ul>
</main>
<div id="toast" class="toast">Đã copy</div>

<script>
  // Link thiệp nằm cùng thư mục với trang này (chạy được cả trên máy lẫn GitHub Pages)
  var base = new URL('./', location.href).href;

  // Thêm thiệp mới: thêm một dòng vào đây
  var TARGETS = [
    { path: '', label: 'Trang chọn thiệp' },
    { path: 'thiep-1/', label: 'Thiệp 1 · Kem & tulip' },
    { path: 'thiep-2/', label: 'Thiệp 2 · Báo cưới' },
    { path: 'thiep-3/', label: 'Thiệp 3 · Hoàng kim' },
    { path: 'thiep-4/', label: 'Thiệp 4 · Liên hoa' }
  ];

  var names = document.getElementById('names');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var timeInput = document.getElementById('time');
  var timeHint = document.getElementById('timeHint');
  var DEFAULT_TIME = { trai: '15:30', gai: '09:00' };   // giờ tiệc in trên thiệp, xem config.js
  var toast = document.getElementById('toast');
  var rows = [];

  try { names.value = localStorage.getItem('guest-names') || ''; } catch (e) {}

  var target = document.getElementById('target');
  TARGETS.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t.path;
    o.textContent = t.label;
    target.appendChild(o);
  });

  function side() { return document.querySelector('input[name=side]:checked').value; }
  function currentTarget() {
    return TARGETS.filter(function (t) { return t.path === target.value; })[0] || TARGETS[0];
  }

  // Nhớ trang, bên, giờ đã chọn lần trước
  try {
    var saved = JSON.parse(localStorage.getItem('guest-options') || '{}');
    if (saved.side === 'gai') document.querySelector('input[name=side][value=gai]').checked = true;
    if (saved.time) timeInput.value = saved.time;
    if (typeof saved.target === 'string' && TARGETS.some(function (t) { return t.path === saved.target; })) target.value = saved.target;
  } catch (e) {}

  var clearTime = document.getElementById('clearTime');
  clearTime.onclick = function () { timeInput.value = ''; onOptionsChange(); };

  function updateHint() {
    clearTime.hidden = !timeInput.value;
    timeHint.textContent = timeInput.value
      ? 'Thiệp sẽ hiện giờ ' + timeInput.value
      : 'Để trống thì dùng giờ trên thiệp (' + DEFAULT_TIME[side()] + ')';
  }

  function onOptionsChange() {
    try { localStorage.setItem('guest-options', JSON.stringify({ side: side(), time: timeInput.value, target: target.value })); } catch (e) {}
    updateHint();
    if (rows.length) render();
  }
  target.onchange = onOptionsChange;
  document.querySelectorAll('input[name=side]').forEach(function (r) { r.onchange = onOptionsChange; });
  timeInput.oninput = onOptionsChange;
  updateHint();

  function linkFor(name, path) {
    var q = '?tenkhach=' + encodeURIComponent(name);
    if (side() === 'gai') q += '&ben=gai';
    if (timeInput.value) q += '&gio=' + timeInput.value;
    return base + path + q;
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  function copy(text, message) {
    var done = function () { showToast(message || 'Đã copy'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text);
      done();
    }
  }

  function fallbackCopy(text) {
    var t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    t.remove();
  }

  function button(text, cls, onclick) {
    var b = document.createElement('button');
    b.className = cls;
    b.textContent = text;
    b.onclick = onclick;
    return b;
  }

  function render() {
    var seen = {};
    rows = names.value.split('\n')
      .map(function (n) { return n.trim().replace(/\s+/g, ' '); })
      .filter(function (n) { if (!n || seen[n]) return false; seen[n] = true; return true; })
      .map(function (n) { return { name: n, url: linkFor(n, currentTarget().path) }; });

    try { localStorage.setItem('guest-names', names.value); } catch (e) {}

    list.innerHTML = '';
    rows.forEach(function (row) {
      var li = document.createElement('li');
      li.className = 'guest';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = row.name;
      var actions = document.createElement('div');
      actions.className = 'row-actions';
      actions.append(
        button('Copy', 'small', function () { copy(row.url, 'Đã copy link cho ' + row.name); }),
        button('Xem', 'small secondary', function () { window.open(row.url, '_blank'); })
      );
      var link = document.createElement('div');
      link.className = 'link';
      link.textContent = row.url;
      li.append(name, actions, link);
      list.appendChild(li);
    });
    count.textContent = rows.length ? rows.length + ' khách mời' : '';
  }

  document.getElementById('make').onclick = render;
  if (names.value.trim()) render();
</script>
</body>
</html>
